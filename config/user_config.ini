[Settings]
# Point to your personal template file
source_file = config/user_demo.txt

# Point to your personal result file
final_file = output/user_result.txt

# Enable online keyword search (disabled by default, must be changed to True)
open_online_search = false

# Enable speed testing and filtering (ensure only usable sources are retained)
open_filter_speed = True

# Enable resolution filtering (optional, filter out low-quality sources)
open_filter_resolution = True